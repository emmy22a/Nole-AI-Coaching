<script>
  // Dynamic Favicon with Image Support
  document.addEventListener('DOMContentLoaded', () => {
    // -----------------------------------------------------------
    // PASTE YOUR IMAGE URL HERE
    // -----------------------------------------------------------
    // Use the Direct Link (ends in .png) for Imgur
    const faviconUrl = 'https://i.imgur.com/6QzmEwS.png'; 
    // -----------------------------------------------------------

    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
    link.type = 'image/x-icon';
    link.rel = 'shortcut icon';
    document.getElementsByTagName('head')[0].appendChild(link);

    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = faviconUrl;

    let opacity = 0;
    let direction = 0.05;

    img.onload = () => {
        function updateFavicon() {
            ctx.clearRect(0, 0, 32, 32);
            
            // Pulse logic
            opacity += direction;
            if (opacity >= 1 || opacity <= 0.3) {
                direction = -direction;
            }

            // Draw Glow
            ctx.save();
            ctx.shadowColor = `rgba(255, 212, 59, ${opacity})`;
            ctx.shadowBlur = 15;
            // Draw image smaller to allow room for glow
            ctx.drawImage(img, 2, 2, 28, 28);
            ctx.restore();

            link.href = canvas.toDataURL("image/png");
        }
        
        // Update at 4FPS to save CPU on Chromebook
        setInterval(updateFavicon, 250); 
    };
  });
</script>
